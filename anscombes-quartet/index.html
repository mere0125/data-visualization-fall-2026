<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Anscombe's Quartet</title>
  <style>
    body {
      margin: 0;
      padding: 40px 24px 64px;
      background: #eaf4ff;
      color: #1f2933;
      font-family: Arial, Helvetica, sans-serif;
    }

    header {
      max-width: 1040px;
      margin: 0 auto 32px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 36px;
    }

    p {
      max-width: 720px;
      margin: 0;
      color: #52606d;
      line-height: 1.5;
    }

    #chart {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
      gap: 24px;
      max-width: 1040px;
      margin: 0 auto;
    }

    svg {
      width: 100%;
      max-width: 500px;
      height: auto;
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
    }

    .chart-title {
      font-size: 18px;
      font-weight: 700;
    }

    .axis-label {
      fill: #52606d;
      font-size: 12px;
    }

    @media (max-width: 560px) {
      body {
        padding: 24px 12px 40px;
      }

      #chart {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <header>
    <h1>Anscombe's Quartet</h1>
    <p>
      Four datasets can share nearly identical summary statistics while forming
      very different visual patterns. Mere Cui — Data Visualization — Fall 2026
    </p>
  </header>

  <div id="chart">the chart will go here</div>

  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
